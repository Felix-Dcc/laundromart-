# Default HTTP reverse proxy (works out of the box).
# For production TLS, see laundromat.ssl.conf.example in this folder.

upstream laundromat_api {
    server api:3000;
    keepalive 32;
}

# Shared proxy settings (WebSocket-aware for Socket.IO).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Uploads / payloads cap (matches the API's 1mb body limit, with headroom).
    client_max_body_size 5m;

    # gzip
    gzip on;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;

    # ACME / certbot webroot (for issuing TLS certs).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Socket.IO (real-time) — must carry the Upgrade headers.
    location /socket.io/ {
        proxy_pass http://laundromat_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API.
    location /api/ {
        proxy_pass http://laundromat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
